<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="삼국 맹장전">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>삼국 맹장전</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;position:fixed;inset:0}
  canvas{display:block;touch-action:none;background:#111}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:#0b0c12;color:#fff;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;font:700 22px "Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
  #rotate .ic{font-size:64px;animation:rot 1.8s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="rotate"><div class="ic">📱</div>가로 모드로 돌려주세요</div>
<script src="game.js"></script>
<script>if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor && location.hostname !== "localhost") navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
